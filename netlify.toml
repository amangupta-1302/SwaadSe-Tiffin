# ============================================================================
#  Netlify configuration
# ============================================================================
#  There is no build step. Netlify publishes the repository as-is and runs:
#
#    netlify/functions/save.mjs        /admin/ posts here to publish a change
#    netlify/functions/ping.mjs        daily tick, keeps free Supabase awake
#    netlify/edge-functions/render.js  fills each page from Supabase on the way out
#
#  Supabase holds the live menu, prices and contact details; the edge function
#  reads the latest row and writes it into the HTML before the visitor gets it.
#  The values baked into index.html are the fallback if that read ever fails.
#
#  Required environment variables — set these in the Netlify UI under
#  Site configuration → Environment variables, never in this file:
#
#    SUPABASE_URL        the project URL, e.g. https://abcdefgh.supabase.co
#    SUPABASE_ANON_KEY   the project's public (anon) API key
#    ADMIN_EMAIL         the one account allowed to save changes
#
#  All three are read by both functions and the edge function. Publishing is a
#  database insert, so nothing here needs write access to the repository.
#
#  Full walkthrough: DEPLOY.md
# ============================================================================

[build]
  publish = "."

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The owner logs in on /admin/ through Supabase; every save is verified
# server-side in the save function. /admin/ itself is safe to reach: it holds
# no credentials and cannot write anything.
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
